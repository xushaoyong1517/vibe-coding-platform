<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
body{width:280px;font:13px/1.5 -apple-system,"Microsoft YaHei",sans-serif;margin:0;padding:12px;color:#222}
h1{font-size:15px;margin:0 0 10px}
.btns{display:flex;gap:8px;margin:8px 0}
button{flex:1;padding:7px;border:0;border-radius:7px;cursor:pointer;font:inherit;font-weight:600}
#full{background:#0e6b62;color:#fff}#inc{background:#137c70;color:#fff}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0}
#counts{margin:8px 0}#last,#msg{font-size:11px;color:#888}#msg{color:#0e6b62;min-height:16px;margin-top:4px}
.links{display:flex;gap:12px;margin-top:10px;font-size:12px}.links a{color:#0e6b62;cursor:pointer}
</style></head><body>
<h1>黑湖小工单 · 本地同步</h1>
<div class="btns"><button id="full">全量同步</button><button id="inc">增量同步</button></div>
<div id="msg"></div><div id="counts"></div><div id="last"></div>
<div class="links"><a id="opt">⚙ 配置/定时</a><a id="browse">🔎 数据浏览</a></div>
<script src="popup.js"></script></body></html>
