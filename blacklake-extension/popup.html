<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font: 13px/1.5 -apple-system, "Microsoft YaHei", sans-serif; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; color: #666; margin: 6px 0 2px; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  .btns { display: flex; gap: 8px; margin: 10px 0; }
  button { flex: 1; padding: 7px; border: 0; border-radius: 7px; cursor: pointer; font: inherit; font-weight: 600; }
  #save { background: #eee; }
  #full { background: #0e6b62; color: #fff; }
  #inc { background: #137c70; color: #fff; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
  #counts { margin: 8px 0; }
  #last, #msg { font-size: 11px; color: #888; }
  #msg { color: #0e6b62; margin-top: 6px; min-height: 16px; }
  details { margin-bottom: 8px; }
  summary { cursor: pointer; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <h1>黑湖小工单 · 本地同步</h1>
  <details>
    <summary>连接配置</summary>
    <label>登录方式</label>
    <select id="loginType"><option value="1">工厂码 + 账号</option><option value="0">手机号</option></select>
    <label>工厂码</label><input id="factory" placeholder="LOGIN_TYPE=1 时填">
    <label>账号</label><input id="user">
    <label>手机号</label><input id="phone" placeholder="LOGIN_TYPE=0 时填">
    <label>密码</label><input id="pwd" type="password">
    <div class="btns"><button id="save">保存配置</button></div>
  </details>
  <div class="btns">
    <button id="full">全量同步</button>
    <button id="inc">增量同步</button>
  </div>
  <div id="msg"></div>
  <div id="counts"></div>
  <div id="last"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
