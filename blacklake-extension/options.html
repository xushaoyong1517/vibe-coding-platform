<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>黑湖同步 · 配置</title><style>
body{font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;max-width:480px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:18px}h2{font-size:14px;color:#555;margin-top:24px;border-top:1px solid #eee;padding-top:16px}
label{display:block;font-size:12px;color:#666;margin:8px 0 2px}
input,select{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #ccc;border-radius:7px;font:inherit}
.inline{display:flex;align-items:center;gap:8px}.inline input[type=checkbox]{width:auto}.inline input[type=number]{width:90px}
button{margin-top:16px;padding:9px 18px;border:0;border-radius:8px;background:#0e6b62;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#msg{margin-left:12px;color:#0e6b62;font-size:13px}
</style></head><body>
<h1>黑湖小工单 · 配置</h1>
<h2>连接</h2>
<label>登录方式</label>
<select id="loginType"><option value="1">工厂码 + 账号</option><option value="0">手机号</option></select>
<label>工厂码（LOGIN_TYPE=1）</label><input id="factory">
<label>账号（LOGIN_TYPE=1）</label><input id="user">
<label>手机号（LOGIN_TYPE=0）</label><input id="phone">
<label>密码</label><input id="pwd" type="password">
<label>接口域名</label><input id="baseUrl" placeholder="https://liteweb.blacklake.cn">
<h2>定时增量同步</h2>
<div class="inline"><input type="checkbox" id="schedEnabled"><label style="margin:0">启用</label>
<span>每</span><input type="number" id="schedMin" min="1" value="60"><span>分钟一次</span></div>
<div><button id="save">保存</button><span id="msg"></span></div>
<script src="options.js"></script></body></html>
